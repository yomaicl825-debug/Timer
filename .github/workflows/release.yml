name: Trial release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release --dart-define=CLOUDBASE_ENV=${{ vars.CLOUDBASE_ENV }}
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package Windows
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '${{ github.ref_name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Require Android signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
            echo 'Android release signing secrets are required.' >&2
            exit 1
          }
      - name: Prepare signing files
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
      - name: Build signed Android APK
        run: flutter build apk --release --dart-define=CLOUDBASE_ENV=${{ vars.CLOUDBASE_ENV }}
      - name: Verify release APK signature
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APK_SIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Collect Android APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Timer-${GITHUB_REF_NAME}-android.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "Timer $GITHUB_REF_NAME" --notes "Windows and Android trial builds. See README and installation notes before use."
